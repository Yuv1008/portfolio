# Render blueprint: the API and its Postgres.
# The two front ends deploy to Vercel (see apps/web/vercel.json and
# apps/admin/vercel.json).
#
# Secrets are `sync: false`, which means Render prompts for them on first
# deploy and never stores them in this file.

databases:
  - name: portfolio-db
    databaseName: portfolio
    user: portfolio
    plan: free
    postgresMajorVersion: '16'

services:
  - type: web
    name: portfolio-api
    runtime: docker
    # Context is the repo root so the build can see packages/shared.
    dockerfilePath: ./apps/api/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: portfolio-db
          property: connectionString

      - key: NODE_ENV
        value: production
      - key: PORT
        value: '4000'

      # Cross-site in production: the admin is on a different domain, so the
      # refresh cookie needs SameSite=None, which in turn requires Secure.
      - key: COOKIE_SAMESITE
        value: none

      # Both front-end origins. CORS allows exactly these two.
      - key: ADMIN_URL
        sync: false
      - key: WEB_URL
        sync: false

      - key: JWT_SECRET
        generateValue: true
      - key: ACCESS_TOKEN_TTL
        value: 15m
      - key: REFRESH_TOKEN_TTL_DAYS
        value: '7'

      # Seeds the first admin. Change the password after the first login.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false

      - key: RESEND_API_KEY
        sync: false
      - key: RESEND_FROM
        sync: false
      - key: OWNER_EMAIL
        sync: false

      # Must match the same variable on the web app in Vercel.
      - key: REVALIDATE_SECRET
        sync: false

      - key: LOG_LEVEL
        value: info
